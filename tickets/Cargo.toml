[package]
name = "flights-tickets"
version = "0.1.0"
edition = "2024"
description = "Склад билетов: текущее состояние серий X→ANY из озера коллектора в Postgres, выборки для планировщика"

[dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["ipc"] }
axum = { version = "0.8", features = ["json", "query"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
futures-util = "0.3"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "lz4", "snap"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
