""" Place types """
enum PlaceType {
  """ Airport """
  AIRPORT
  """ City """
  CITY
  """ Country """
  COUNTRY
}

type Price {
  """ Departure date """
  departure_at: String!
  """ Return date, can be left empty if one way ticket """
  return_at: String
  """ Origin airport IATA code """
  origin_airport_iata: String!
  """ Origin city IATA code """
  origin_city_iata: String!
  """ Origin country IATA code """
  origin_country_iata: String!
  """ Destination airport IATA code """
  destination_airport_iata: String!
  """ Destination city IATA code """
  destination_city_iata: String!
  """ Destination country IATA code """
  destination_country_iata: String!
  """ Price in a given currency """
  value: Float!
  """ Currency ISO code """
  currency: String!
  """ Route weight score """
  route_weight: Int!
  """ Distance in kilometers between origin and destination """
  distance: Int
  """ Flight duration in minutes of all flight legs """
  duration: Int!
  """ Duration in days between departure and return dates. Only for round trip prices """
  trip_duration: Int!
  """ Price per kilometer """
  distance_unit_price: Float! @deprecated(reason: "field is ignored")
  """ Maximum number of transfers per segment """
  number_of_changes: Int!
  """ Agent who offers this ticket """
  gate: String!
  """ UUID of search """
  search_id: String!
  """ Airline that flies the longest among all segments """
  main_airline: String!
  """ Date and time when the ticket was found """
  found_at: Int!
  """ No lowcost (watch the definition in query params) """
  no_lowcost: Boolean!
  """ No night change (watch the definition in query params) """
  no_night_change: Boolean!
  """ Convenient (watch the definition in query params) """
  convenient: Boolean!
  """ Visa isn't required when transfer """
  no_visa_at_transfer: Boolean!
  """Baggage code describes the checked-baggage allowance for the returned offer in the following format:
{pieces}PC — number of baggage pieces (weight not specified)
{pieces}PC{weightKg} — number of pieces + max weight in kilograms (per piece)
{pieces}PC{weightKg}x{dimSum} — number of pieces + weight (kg) + total dimensions sum"""
  baggage_code: String!
  """ With baggage """
  with_baggage: Boolean!
  """ Segments """
  segments: [Segment!]!
  """ Ticket link """
  ticket_link: String!
  """ Discount calculated as deviation from average price for current ticket """
  discount: Float!
  """ Ticket trip class """
  trip_class: String!
  """ Price source """
  provider: PriceProvider!
}

""" Price providers """
enum PriceProvider {
  """ Organic searches """
  ORGANIC
  """ External source """
  EXTERNAL
  """ Predicted price """
  PREDICTED
}

type Segment {
  """ Departure date of the first flight of the segment """
  departure_at: String!
  """ Arrival date of the last flight of the segment """
  arrival_at: String!
  """ Transfers of the segment """
  transfers: [Transfer!]!
  """ Flights of the segment """
  flight_legs: [FlightLeg!]!
}

""" Sorting options """
enum Sorting {
  """ ORDER BY value ASC """
  VALUE_ASC
  """ ORDER BY distance_unit_price ASC(deprecated)"""
  DISTANCE_UNIT_PRICE_ASC
  """ ORDER BY route_weight DESC """
  ROUTE_WEIGHT_DESC
  """ ORDER BY discount DESC """
  DISCOUNT_DESC
}

type Transfer {
  """ Origin of transfer """
  at: String!
  """ Destination of transfer """
  to: String!
  """ Country code """
  country_code: String!
  """ Duration of transfer in seconds """
  duration_seconds: Int!
  """ Night transfer """
  night_transfer: Boolean!
  """ Visa required """
  visa_required: Boolean!
}

""" Trip class options """
enum TripClass {
  """ Economy class """
  Y
  """ Business class """
  C
  """ First class """
  F
  """ Premium economy """
  W
}
