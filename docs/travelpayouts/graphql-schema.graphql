type Query {
  """ Query for one way prices """
  prices_one_way(paging: Paging = {limit:30,offset:0}, sorting: Sorting = VALUE_ASC, grouping: GroupingOneWay = DATES, params: ParamsOneWay!, currency: String = rub, market: String = ru, brand: Brand = AS): [Price!]!
  """ Query for round trip prices """
  prices_round_trip(paging: Paging = {limit:30,offset:0}, sorting: Sorting = VALUE_ASC, grouping: GroupingRoundTrip = DATES, params: ParamsRoundTrip!, currency: String = rub, market: String = ru, brand: Brand = AS): [Price!]!
  """ Query for one way special offers """
  special_offers_one_way(paging: Paging = {limit:30,offset:0}, grouping: GroupingSpecialOfferOneWay = DEPART_DATE, params: ParamsSpecialOfferOneWay!, currency: String = rub, experimental: Boolean = false, market: String = ru, brand: Brand = AS): [Price!]!
  """ Query for round trip special offers """
  special_offers_round_trip(paging: Paging = {limit:30,offset:0}, grouping: GroupingSpecialOfferRoundTrip = DATES, params: ParamsSpecialOfferRoundTrip!, currency: String = rub, experimental: Boolean = false, market: String = ru, brand: Brand = AS): [Price!]!
  """ Query for round trip weekend prices """
  weekend_prices_round_trip(paging: Paging = {limit:30,offset:0}, sorting: Sorting = VALUE_ASC, grouping: GroupingWeekendRoundTrip = DEPART_RETURN_DATE_HOUR, params: ParamsWeekendRoundTrip!, currency: String = rub, experimental: Boolean = false, market: String = ru, brand: Brand = AS): [Price!]!
}

enum Brand {
  """ Aviasales brand """
  AS
}

""" Date format YYYY-MM-DD """
scalar Date

""" DateTime format YYYY-MM-DD hh:mm """
scalar DateTime

type FlightLeg {
  """ Origin airport IATA code """
  origin: String!
  """ Destination airport IATA code """
  destination: String!
  """ Departure date """
  departure_at: String!
  """ Arrival date """
  arrival_at: String!
  """ Flight number """
  flight_number: String!
  """ Airline carrying """
  operating_carrier: String!
  """ Aircraft model code """
  aircraft_code: String!
}

""" One way grouping options """
enum GroupingOneWay {
  """ DO NOT GROUP """
  NONE
  """ GROUP BY depart_date """
  DEPART_DATE
  """ GROUP BY origin_city_iata, destination_city_iata """
  DIRECTIONS
  """ GROUP BY depart_date, return_date """
  DATES
  """ GROUP BY depart_date, return_date, number_of_changes """
  DATES_NUM_OF_CHANGES
  """ GROUP BY depart_year, depart_month """
  YEAR_MONTH
}

""" Round trip grouping options """
enum GroupingRoundTrip {
  """ DO NOT GROUP """
  NONE
  """ GROUP BY depart_date """
  DEPART_DATE
  """ GROUP BY origin_city_iata, destination_city_iata """
  DIRECTIONS
  """ GROUP BY depart_date, return_date """
  DATES
  """ GROUP BY depart_date, return_date, number_of_changes """
  DATES_NUM_OF_CHANGES
  """ GROUP BY depart_year, depart_month """
  YEAR_MONTH
}

""" Special offers one way grouping options """
enum GroupingSpecialOfferOneWay {
  """ GROUP BY depart_date """
  DEPART_DATE
  """ GROUP BY origin_city_iata, destination_city_iata """
  DIRECTIONS
}

""" Special offers round trip grouping options """
enum GroupingSpecialOfferRoundTrip {
  """ GROUP BY depart_date, return_date """
  DATES
  """ GROUP BY origin_city_iata, destination_city_iata """
  DIRECTIONS
}

""" Weekend round trip grouping options """
enum GroupingWeekendRoundTrip {
  """ GROUP BY depart_date, depart_hour, return_date, return_hour """
  DEPART_RETURN_DATE_HOUR
  """ GROUP BY depart_date """
  DEPART_DATE
  """ GROUP BY depart_date, return_date """
  DATES
  """ GROUP BY origin_city_iata, destination_city_iata """
  DIRECTIONS
}

""" Pagination parameters """
input Paging {
  limit: Int!
  offset: Int!
}

""" Search params for one way prices """
input ParamsOneWay {
  """Origin IATA code.
Accepts airport, city or country IATA code as input. Can be used together or separately with origin_type field.
If origin_type isn't provided, tries to resolve origin type automatically"""
  origin: String
  """ Origin place type, resolved by application if it was left blank """
  origin_type: PlaceType
  """Destination IATA code.
Accepts airport, city or country IATA code as input. Can be used together or separately with destination_type field.
If destination_type isn't provided, tries to resolve destination type automatically"""
  destination: String
  """ Destination place type, resolved by application if it was left blank """
  destination_type: PlaceType
  """ Trip class """
  trip_class: TripClass
  """List of depart months.
Must be provided in 'YYYY-MM-01' format"""
  depart_months: [Date!]
  """List of depart dates.
Must be provided in 'YYYY-MM-DD' format"""
  depart_dates: [Date!]
  """ Minimum departure date """
  depart_date_min: Date
  """ Maximum departure date """
  depart_date_max: Date
  """ Minimum ticket price """
  value_min: Int
  """ Maximum ticket price """
  value_max: Int
  """ Only direct flights, number of changes = 0 """
  direct: Boolean
  """Only convenient tickets, which are:
- with a maximum of one transfer;
- no overnight transfers;
- no long transfers (>=4 hours);
- no short transfers (<=60 minutes);
- no transfers with a change of airport;
- no transfers that require a visa."""
  convenient: Boolean
  """Without lowcost airline tickets

Deprecated: parameter is ignored"""
  no_lowcost: Boolean
  """ Visa isn't required when transfer """
  no_visa_at_transfer: Boolean
  """ With baggage """
  with_baggage: Boolean
}

