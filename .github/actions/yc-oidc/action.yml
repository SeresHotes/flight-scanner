name: Yandex Cloud login (OIDC)
description: >
  Меняет OIDC-токен GitHub на IAM-токен сервисного аккаунта через федерацию flights-github
  (infra/terraform/github.tf) и кладёт его в YC_TOKEN. Нужны `permissions: id-token: write`
  и job в environment prod — федерация выдаёт токен только этому subject.
inputs:
  service-account-id:
    description: ID сервисного аккаунта (vars.YC_CI_SA_ID / vars.YC_TERRAFORM_SA_ID)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SA_ID: ${{ inputs.service-account-id }}
        AUDIENCE: https://github.com/${{ github.repository_owner }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::Нет OIDC: в workflow нужно permissions: id-token: write"; exit 1
        fi
        ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
        echo "::add-mask::$ID_TOKEN"
        RESP=$(curl -sS -X POST https://auth.yandex.cloud/oauth/token \
          --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
          --data-urlencode requested_token_type=urn:ietf:params:oauth:token-type:access_token \
          --data-urlencode audience="$SA_ID" \
          --data-urlencode subject_token="$ID_TOKEN" \
          --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:id_token)
        IAM_TOKEN=$(jq -r '.access_token // empty' <<<"$RESP")
        if [ -z "$IAM_TOKEN" ]; then
          echo "::error::Yandex Cloud не выдал IAM-токен: $(jq -c 'del(.access_token)' <<<"$RESP" 2>/dev/null || echo "$RESP")"
          exit 1
        fi
        echo "::add-mask::$IAM_TOKEN"
        echo "YC_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"
