name: Deploy

# Собирает образы flights-planner (Rust, planner/), flights-collector, flights-crawler, flights-tickets (Rust, tickets/) и flights-web, пушит в Yandex
# Container Registry и (опционально) мгновенно выкатывает на VM по SSH. Если
# SSH-секреты не заданы — VM подхватит свежие образы сама (systemd-таймер
# flights-update каждые 2 мин).
#
# Обязательные секреты (Settings → Secrets and variables → Actions):
#   YC_SA_KEY_JSON  — authorized-key SA flights-ci (terraform output ci_sa_key_json)
#   YC_FOLDER_ID    — ID каталога
#   YC_REGISTRY_ID  — ID реестра (terraform output registry_id)
# Опциональные (для мгновенного деплоя; иначе выкатка таймером ~2 мин):
#   VM_SSH_HOST     — внешний IP VM (terraform output vm_external_ip)
#   VM_SSH_KEY      — приватный SSH-ключ (пара к var.ssh_public_key; пользователь ubuntu)
#   VM_SSH_USER     — пользователь SSH (по умолчанию ubuntu)

on:
  push:
    branches: [main]
    paths:
      - "planner/**"
      - "collector/**"
      - "crawler/**"
      - "tickets/**"
      - "core/**"
      - "storage/**"
      - "frontend/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check secrets configured
        id: check
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          if [ -n "$YC_SA_KEY_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты YC не заданы — деплой пропущен (см. infra/terraform/README.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Install yc CLI
        if: steps.check.outputs.ok == 'true'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate to Yandex Cloud
        if: steps.check.outputs.ok == 'true'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_KEY_JSON" > "$HOME/sa-key.json"
          yc config profile create ci 2>/dev/null || yc config profile activate ci
          yc config set service-account-key "$HOME/sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"
          yc container registry configure-docker

      # Три образа из трёх Dockerfile; общий код core/ и storage/ копируется в каждый.
      - name: Build & push images
        if: steps.check.outputs.ok == 'true'
        env:
          REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          SHA="${GITHUB_SHA::7}"
          for pair in planner:deploy/Dockerfile.planner collector:deploy/Dockerfile.collector crawler:deploy/Dockerfile.crawler tickets:deploy/Dockerfile.tickets web:deploy/Dockerfile.web; do
            NAME="${pair%%:*}"; FILE="${pair#*:}"
            IMAGE="cr.yandex/$REGISTRY_ID/flights-$NAME"
            docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" -f "$FILE" .
            docker push "$IMAGE:latest"
            docker push "$IMAGE:$SHA"
          done

      - name: Cleanup credentials
        if: always() && steps.check.outputs.ok == 'true'
        run: rm -f "$HOME/sa-key.json"

  # Мгновенная выкатка на VM по SSH (иначе — таймер flights-update на VM, ~2 мин).
  deploy:
    needs: build-push
    if: needs.build-push.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        id: check
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -n "$VM_SSH_HOST" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH-секреты не заданы — мгновенный деплой пропущен, VM подхватит образы таймером (~2 мин)."
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.ok == 'true'
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          USER_NAME="${VM_SSH_USER:-ubuntu}"
          # run.sh на VM: логин в реестр IAM-токеном SA + docker compose pull + up -d.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "$USER_NAME@$VM_SSH_HOST" 'sudo systemctl start flights-update.service'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
