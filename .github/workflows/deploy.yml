name: Deploy

# Собирает образы flights-planner (Rust, planner/), flights-collector, flights-crawler и flights-web, пушит в Yandex
# Container Registry и сразу выкатывает на VM по SSH (иначе VM подхватит свежие образы
# сама — systemd-таймер flights-update каждые 2 мин).
#
# Вход в Yandex Cloud — без ключей: IAM-токен SA flights-ci через федерацию GitHub
# (infra/terraform/github.tf, job в environment prod — туда пускают только main), SSH-ключ
# деплоя — из Lockbox flights-ops. Переменные environment prod (YC_CI_SA_ID, YC_REGISTRY_ID,
# LOCKBOX_OPS_ID, VM_HOST, VM_SSH_KNOWN_HOSTS) заводит infra/terraform/bootstrap.sh.
# Пока его не запускали — старый путь: секреты репозитория YC_SA_KEY_JSON / YC_FOLDER_ID /
# YC_REGISTRY_ID (удаляются после переезда, README).

on:
  push:
    branches: [main]
    paths:
      - "planner/**"
      - "collector/**"
      - "crawler/**"
      - "core/**"
      - "storage/**"
      - "frontend/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/yc-oidc/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      pushed: ${{ steps.check.outputs.ok }}
      ssh: ${{ steps.check.outputs.ssh }}
    steps:
      - name: Check credentials configured
        id: check
        env:
          CI_SA_ID: ${{ vars.YC_CI_SA_ID }}
          LOCKBOX_OPS_ID: ${{ vars.LOCKBOX_OPS_ID }}
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          if [ -n "$CI_SA_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$YC_SA_KEY_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Доступ к Yandex Cloud не настроен — деплой пропущен (infra/terraform/README.md)."
          fi
          [ -n "$CI_SA_ID" ] && [ -n "$LOCKBOX_OPS_ID" ] && echo "ssh=true" >> "$GITHUB_OUTPUT" || true

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: ./.github/actions/yc-oidc
        if: steps.check.outputs.mode == 'oidc'
        with:
          service-account-id: ${{ vars.YC_CI_SA_ID }}

      - name: Docker login (IAM token)
        if: steps.check.outputs.mode == 'oidc'
        run: printf '%s' "$YC_TOKEN" | docker login cr.yandex --username iam --password-stdin

      # Старый путь — authorized-key SA flights-ci; уйдёт вместе с секретом YC_SA_KEY_JSON.
      - name: Docker login (SA key, legacy)
        if: steps.check.outputs.mode == 'key'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          printf '%s' "$YC_SA_KEY_JSON" > "$HOME/sa-key.json"
          "$HOME/yc/bin/yc" config profile create ci 2>/dev/null || "$HOME/yc/bin/yc" config profile activate ci
          "$HOME/yc/bin/yc" config set service-account-key "$HOME/sa-key.json"
          "$HOME/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
          "$HOME/yc/bin/yc" iam create-token | docker login cr.yandex --username iam --password-stdin
          rm -f "$HOME/sa-key.json"

      # Четыре образа из четырёх Dockerfile; общий код core/ копируется в каждый.
      - name: Build & push images
        if: steps.check.outputs.ok == 'true'
        env:
          REGISTRY_ID: ${{ vars.YC_REGISTRY_ID || secrets.YC_REGISTRY_ID }}
        run: |
          SHA="${GITHUB_SHA::7}"
          for pair in planner:deploy/Dockerfile.planner collector:deploy/Dockerfile.collector crawler:deploy/Dockerfile.crawler web:deploy/Dockerfile.web; do
            NAME="${pair%%:*}"; FILE="${pair#*:}"
            IMAGE="cr.yandex/$REGISTRY_ID/flights-$NAME"
            docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" -f "$FILE" .
            docker push "$IMAGE:latest"
            docker push "$IMAGE:$SHA"
          done

      - name: Docker logout
        if: always() && steps.check.outputs.ok == 'true'
        run: docker logout cr.yandex || true

  # Мгновенная выкатка на VM по SSH (иначе — таймер flights-update на VM, ~2 мин).
  deploy:
    needs: build-push
    if: needs.build-push.outputs.pushed == 'true' && needs.build-push.outputs.ssh == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/yc-oidc
        with:
          service-account-id: ${{ vars.YC_CI_SA_ID }}

      - name: SSH key from Lockbox
        env:
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          .github/scripts/lockbox.sh ${{ vars.LOCKBOX_OPS_ID }} vm_ssh_key=@$HOME/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # run.sh на VM: логин в реестр IAM-токеном SA + docker compose pull + up -d.
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "ubuntu@$VM_HOST" 'sudo systemctl start flights-update.service'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
