# Прод-compose: образы из Container Registry (НЕ сборка). Лежит в образе planner
# (/app/deploy/compose.prod.yml); run.sh на VM копирует его в /opt/flights/docker-compose.yml
# при каждом обновлении — состав контейнеров меняется обычным деплоем.
#
# Переменные подстановки и секреты — /opt/flights/.env (пишет terraform в cloud-init,
# на существующей VM дополняют deploy/vm-migrate.sh и deploy/vm-tickets-env.sh):
# PLANNER_IMAGE, COLLECTOR_IMAGE, CRAWLER_IMAGE, WEB_IMAGE, TICKETS_IMAGE, TICKETS_PG_PASSWORD,
# SITE_DOMAIN, TRAVELPAYOUTS_TOKEN, S3_*, LAKE_MAX_GB, RATE_PER_MINUTE, CRAWL_* (см. crawler/config.py).
services:
  # Планировщик: axum /api/*, джобы стыковки; рейсы — из склада билетов, серии — у коллектора.
  planner:
    image: ${PLANNER_IMAGE}
    env_file:
      - /opt/flights/.env
    environment:
      - COLLECTOR_URL=http://collector:8001
      - TICKETS_URL=http://tickets:8002
    volumes:
      - /opt/flights/data:/app/data
    depends_on:
      - collector
      - tickets
    restart: always

  # Коллектор: очередь к GraphQL, лимит ручки, Parquet-озеро в Object Storage; каждый
  # записанный файл пушится в склад билетов.
  collector:
    image: ${COLLECTOR_IMAGE}
    env_file:
      - /opt/flights/.env
    environment:
      - TICKETS_URL=http://tickets:8002
    volumes:
      - /opt/flights/data:/app/data
    restart: always

  # Склад билетов (Rust, docs/TICKETS.md): текущее состояние серий X→ANY в Postgres,
  # выборки для планировщика; сверяется с озером через коллектор.
  tickets:
    image: ${TICKETS_IMAGE:-cr.yandex/crp7odiamp18s3633n30/flights-tickets:latest}
    environment:
      - TICKETS_PG_URL=postgres://tickets:${TICKETS_PG_PASSWORD}@tickets-db:5432/tickets
      - COLLECTOR_URL=http://collector:8001
      - TICKETS_SYNC_WORKERS=4
    depends_on:
      - tickets-db
      - collector
    restart: always

  # Postgres склада билетов: ~20 млн строк (~30 ГБ с индексами), данные на диске VM.
  # Память под 8 ГБ VM: shared_buffers 1 ГБ; остальное — кэш ОС.
  tickets-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=tickets
      - POSTGRES_PASSWORD=${TICKETS_PG_PASSWORD}
      - POSTGRES_DB=tickets
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=64MB
      -c maintenance_work_mem=512MB -c max_wal_size=4GB -c checkpoint_completion_target=0.9
      -c synchronous_commit=off -c autovacuum_vacuum_scale_factor=0.02 -c random_page_cost=1.5
    shm_size: 512m
    volumes:
      - /opt/flights/pg:/var/lib/postgresql/data
    restart: always

  # Фоновый сборщик: планирует покрытие город × день и подаёт серии в очередь crawl.
  # Дефолт образа — на случай .env, созданного до фазы 2 (там нет CRAWLER_IMAGE);
  # реестр тот же, что у остальных образов.
  crawler:
    image: ${CRAWLER_IMAGE:-cr.yandex/crp7odiamp18s3633n30/flights-crawler:latest}
    env_file:
      - /opt/flights/.env
    environment:
      - COLLECTOR_URL=http://collector:8001
    depends_on:
      - collector
    restart: always

  # Caddy: статика фронта, TLS, reverse-proxy /api → planner.
  web:
    image: ${WEB_IMAGE}
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - planner
    restart: always
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
